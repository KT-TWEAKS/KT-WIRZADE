name: Secret and dependency security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Install Gitleaks CLI
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.1
      - name: Scan complete Git history for credentials
        run: '"$(go env GOPATH)/bin/gitleaks" git . --redact --exit-code 1'
