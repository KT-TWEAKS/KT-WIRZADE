name: Secret and dependency security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install Gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan complete Git history for credentials
        env:
          REPORT: ${{ runner.temp }}/gitleaks.sarif
        run: |
          "$(go env GOPATH)/bin/gitleaks" git . --redact --report-format sarif --report-path "$REPORT" --exit-code 1
      - name: Preserve redacted findings for triage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redacted-gitleaks-sarif
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7
