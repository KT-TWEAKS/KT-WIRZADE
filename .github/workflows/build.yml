name: KT WIRZADE Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-version: '17.0'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet
        run: |
          msbuild KT-Wirzade.sln /t:Restore /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$(pwd)\\"

      - name: Prepare client-helper.dll
        run: |
          if (Test-Path "Core\Helper\x64\Release\client-helper.dll") {
            Write-Host "client-helper.dll already exists"
          } else {
            New-Item -ItemType Directory -Path "Core\Helper\x64\Release" -Force
            if (Test-Path "KTWirzade.GUI\src\Resources\client-helper.dll") {
              Copy-Item "KTWirzade.GUI\src\Resources\client-helper.dll" "Core\Helper\x64\Release\client-helper.dll"
            } else {
              Write-Host "::warning::client-helper.dll not found - build may fail"
            }
          }

      - name: Build Shared + CLI
        run: |
          msbuild KT-Wirzade.sln /t:Build /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$(pwd)\\"

      - name: Sync fresh Shared deps and CLI.exe into GUI Resources
        shell: pwsh
        run: |
          $SHARED = "KTWirzade.Shared\bin\x64\Release"
          $RES = "KTWirzade.GUI\src\Resources"
          Get-ChildItem $SHARED -Filter "*.dll" | ForEach-Object { Copy-Item -Force $_.FullName $RES }
          # The GUI embeds KTWirzade.CLI.exe - it must be updated BEFORE building the GUI,
          # otherwise the stale committed copy stays embedded.
          Copy-Item -Force "KTWirzade.CLI\bin\x64\Release\KTWirzade.CLI.exe" "$RES\KTWirzade.CLI.exe"

      - name: Build GUI
        run: |
          dotnet build KTWirzade.GUI/src/KTWirzade.GUI.csproj -c Release -p:Platform=x64 -p:SolutionDir="$(pwd)\\"

      - name: Build APBX Developer (DevTool)
        run: |
          dotnet build KTWirzade.DevTool/KTWirzade.DevTool.csproj -c Release -p:Platform=x64

      - name: Copy Shared deps to GUI bin and CLI Standalone
        shell: pwsh
        run: |
          $SHARED = "KTWirzade.Shared\bin\x64\Release"
          $GUI = "KTWirzade.GUI\src\bin\x64\Release\net4.8-windows"
          $CLI = "KTWirzade.CLI\bin\x64\Release"
          $STANDALONE = "CLI-Standalone"
          Get-ChildItem $SHARED -Filter "*.dll" | ForEach-Object {
            Copy-Item -Force $_.FullName $GUI
            Copy-Item -Force $_.FullName $STANDALONE
          }
          Copy-Item -Force "$CLI\KTWirzade.CLI.exe" "$STANDALONE\KTWirzade.CLI.exe"
          Copy-Item -Force "$GUI\*.config" "$STANDALONE"
          Copy-Item -Force "$GUI\KTWirzade.GUI.exe" "$STANDALONE\KTWirzade.GUI.exe"

      - name: Package APBX Developer into CLI-Standalone
        shell: pwsh
        run: |
          $DEVTOOL = "KTWirzade.DevTool\bin\x64\Release\net4.8-windows"
          $DEST = "CLI-Standalone\APBX-Developer"
          if (Test-Path $DEST) { Remove-Item -Recurse -Force $DEST }
          New-Item -ItemType Directory -Path $DEST -Force | Out-Null
          Copy-Item -Path "$DEVTOOL\*" -Destination $DEST -Exclude "*.pdb"
          Write-Host "APBX Developer packaged:" (Get-ChildItem $DEST).Count "files"

      - name: Smoke test CLI
        shell: pwsh
        run: |
          $result = & "CLI-Standalone\KTWirzade.CLI.exe" 2>&1
          Write-Host $result

      - name: Smoke test GUI (3s)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "CLI-Standalone\KTWirzade.GUI.exe" -PassThru
          Start-Sleep -Seconds 3
          if (-not $p.HasExited) {
            Write-Host "GUI OK (PID: $($p.Id))"
            Stop-Process -Id $p.Id -Force
          } else {
            Write-Host "GUI closed unexpectedly (Exit: $($p.ExitCode))"
            exit 1
          }
