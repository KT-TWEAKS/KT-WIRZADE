name: KT WIRZADE Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and package
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Upload verified release package
        uses: actions/upload-artifact@v4
        with:
          name: KT-WIRZADE-v1.0.2-win-x64
          path: |
            artifacts/KT-WIRZADE-v1.0.2-win-x64.exe
            artifacts/KT-WIRZADE-v1.0.2-manifest.json
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          files: |
            artifacts/KT-WIRZADE-v1.0.2-win-x64.exe
            artifacts/KT-WIRZADE-v1.0.2-manifest.json
            artifacts/SHA256SUMS.txt
          body_path: RELEASE-1.0.2.md
