<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playbooks Verificados - KT WIRZADE</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 2 L28 8 V16 C28 24 22 30 16 32 C10 30 4 24 4 16 V8 Z' fill='%2300d4aa'/><polyline points='10,16 14,20 22,12' stroke='white' stroke-width='3' fill='none'/></svg>">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="nav-logo">
      <img src="assets/logo.svg" alt="KT WIRZADE">
    </a>
    <button class="nav-mobile-toggle" aria-label="Menu">&#9776;</button>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="verify.html">Verificar</a></li>
      <li><a href="playbooks.html" class="active">Playbooks</a></li>
      <li><a href="api-docs.html">API</a></li>
      <li><button class="theme-toggle" aria-label="Tema">&#9790;</button></li>
    </ul>
  </div>
</nav>

<div class="playbooks-header">
  <div class="container">
    <div class="section-tag">Catalogo</div>
    <h1 class="section-title">Playbooks Verificados</h1>
    <p class="section-desc">Todos os playbooks oficiais KT WIRZADE verificados e aprovados.</p>
    <div class="search-bar">
      <input type="text" id="search-input" class="form-input" placeholder="Buscar playbooks...">
    </div>
    <div class="filter-tags" id="filter-tags">
      <button class="filter-tag active" data-tag="">Todos</button>
      <button class="filter-tag" data-tag="debloat">Debloat</button>
      <button class="filter-tag" data-tag="privacidade">Privacidade</button>
      <button class="filter-tag" data-tag="gaming">Gaming</button>
      <button class="filter-tag" data-tag="otimizacao">Otimizacao</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="playbooks-grid" id="playbooks-grid"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <p>&copy; 2026 KT WIRZADE. Todos os direitos reservados.</p>
    </div>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  loadPlaybooks();

  document.getElementById('search-input').addEventListener('input', debounce(() => loadPlaybooks(), 300));

  document.querySelectorAll('.filter-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
      tag.classList.add('active');
      loadPlaybooks();
    });
  });

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
  });
});

async function loadPlaybooks() {
  const grid = document.getElementById('playbooks-grid');
  const search = document.getElementById('search-input').value;
  const activeTag = document.querySelector('.filter-tag.active')?.getAttribute('data-tag') || '';

  grid.innerHTML = '<div class="empty-state loading"><p>Carregando playbooks...</p></div>';

  try {
    const data = await window.ktAPI.getPlaybooks(search, activeTag);
    renderPlaybooks(data.playbooks);
  } catch (err) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-state-icon">&#9888;</div><p>Erro ao carregar playbooks.</p></div>`;
  }
}

function renderPlaybooks(playbooks) {
  const grid = document.getElementById('playbooks-grid');

  if (!playbooks.length) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#128269;</div><p>Nenhum playbook encontrado.</p></div>';
    return;
  }

  grid.innerHTML = playbooks.map(pb => `
    <div class="playbook-card" onclick="openModal('${pb.id}')">
      <div class="playbook-card-header">
        <div class="playbook-icon">${pb.name.charAt(0)}</div>
        <div class="verified-badge">&#10003; Verificado</div>
      </div>
      <h3>${pb.name}</h3>
      <p>${pb.description}</p>
      <div class="playbook-meta">
        <span>&#128100; ${pb.author}</span>
        <span>&#128196; v${pb.version}</span>
        <span>&#128279; ${pb.productCode}</span>
      </div>
    </div>
  `).join('');

  initScrollAnimations();
}

function initScrollAnimations() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.style.opacity = '1';
        entry.target.style.transform = 'translateY(0)';
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.playbook-card').forEach(el => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(24px)';
    el.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
    observer.observe(el);
  });
}

async function openModal(id) {
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');

  content.innerHTML = '<div class="empty-state loading"><p>Carregando...</p></div>';
  overlay.classList.add('show');

  try {
    const data = await window.ktAPI.getPlaybook(id);
    const pb = data.playbook;
    content.innerHTML = `
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;">
        <div class="playbook-icon" style="width:56px;height:56px;font-size:1.5rem;">${pb.name.charAt(0)}</div>
        <div>
          <h2 style="margin-bottom:4px;">${pb.name}</h2>
          <div class="verified-badge">&#10003; Verificado</div>
        </div>
      </div>
      <div class="result-details" style="border-top:none;padding-top:0;">
        <div class="result-detail-row">
          <span class="result-detail-label">ProductCode</span>
          <span class="result-detail-value" style="font-family:monospace;">${pb.productCode}</span>
        </div>
        <div class="result-detail-row">
          <span class="result-detail-label">Autor</span>
          <span class="result-detail-value">${pb.author}</span>
        </div>
        <div class="result-detail-row">
          <span class="result-detail-label">Versao</span>
          <span class="result-detail-value">${pb.version}</span>
        </div>
        <div class="result-detail-row">
          <span class="result-detail-label">Verificado em</span>
          <span class="result-detail-value">${new Date(pb.verifiedAt).toLocaleDateString('pt-BR')}</span>
        </div>
      </div>
      <p style="color:var(--text-muted);margin:20px 0;line-height:1.7;">${pb.description}</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;">
        ${pb.website ? `<a href="${pb.website}" target="_blank" class="btn btn-secondary btn-sm">Site Oficial</a>` : ''}
        ${pb.git ? `<a href="${pb.git}" target="_blank" class="btn btn-secondary btn-sm">GitHub</a>` : ''}
        <a href="verify.html" class="btn btn-primary btn-sm">Verificar Este</a>
      </div>
    `;
  } catch (err) {
    content.innerHTML = '<div class="empty-state"><p>Erro ao carregar detalhes.</p></div>';
  }
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

function debounce(fn, ms) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}
</script>
</body>
</html>
