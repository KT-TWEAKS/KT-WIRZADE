<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar Playbook - KT WIRZADE</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 2 L28 8 V16 C28 24 22 30 16 32 C10 30 4 24 4 16 V8 Z' fill='%2300d4aa'/><polyline points='10,16 14,20 22,12' stroke='white' stroke-width='3' fill='none'/></svg>">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="nav-logo">
      <img src="assets/logo.svg" alt="KT WIRZADE">
    </a>
    <button class="nav-mobile-toggle" aria-label="Menu">&#9776;</button>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="verify.html" class="active">Verificar</a></li>
      <li><a href="playbooks.html">Playbooks</a></li>
      <li><a href="api-docs.html">API</a></li>
      <li><button class="theme-toggle" aria-label="Tema">&#9790;</button></li>
    </ul>
  </div>
</nav>

<div class="verify-hero">
  <div class="container">
    <div class="section-tag">Verificacao</div>
    <h1 class="section-title">Verificar Playbook</h1>
    <p class="section-desc">Insira o ProductCode ou faca upload do arquivo para verificar autenticidade.</p>
  </div>
</div>

<div class="verify-container">
  <div class="verify-box">
    <div class="verify-tabs">
      <button class="verify-tab active" id="tab-code">ProductCode</button>
      <button class="verify-tab" id="tab-file">Arquivo</button>
    </div>

    <div id="panel-code">
      <div class="form-group">
        <label for="product-code">ProductCode</label>
        <input type="text" id="product-code" class="form-input" placeholder="Ex: KTW-DEBLOAT-001">
      </div>
    </div>

    <div id="panel-file" style="display: none;">
      <div class="drop-zone" id="drop-zone">
        <div class="drop-zone-icon">&#128194;</div>
        <div class="drop-zone-text">
          Arraste um arquivo aqui ou <strong>clique para selecionar</strong>
        </div>
      </div>
      <input type="file" id="file-input" style="display: none;">
      <input type="hidden" id="file-hash">
    </div>

    <button class="btn btn-primary verify-btn" id="verify-btn">Verificar</button>

    <div class="result-box" id="result-box">
      <div class="result-status">
        <div class="result-icon"></div>
        <div class="result-title"></div>
      </div>
      <div class="result-details"></div>
    </div>
  </div>

  <div class="history-section">
    <h3 class="history-title">&#128203; Historico Recente</h3>
    <div class="history-list" id="history-list"></div>
  </div>
</div>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <p>&copy; 2026 KT WIRZADE. Todos os direitos reservados.</p>
    </div>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/verify.js"></script>
</body>
</html>
